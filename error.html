<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Aqua Maker</title>
<style>
  :root{
    --bg-0:#04060f; --bg-panel:#0e1730; --bg-panel-2:#121f3d; --line:rgba(120,190,255,0.14);
    --aqua:#4fe3ff; --aqua-deep:#0d7fb8; --ink:#eaf5ff; --ink-mute:#7f93b3; --danger:#ff5f7e;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background: radial-gradient(ellipse 60% 45% at 18% -5%, rgba(30,90,140,0.35), transparent 60%),
                linear-gradient(180deg, var(--bg-0) 0%, #070c1c 45%, #0d1630 100%);
    color:var(--ink); font-family:'Segoe UI', Inter, sans-serif;
    display:flex; align-items:center; justify-content:center;
    -webkit-user-select:none; user-select:none;
  }
  .box{ text-align:center; max-width:440px; padding:40px; }
  .box img{ width:64px; margin-bottom:20px; opacity:0.9; filter:drop-shadow(0 0 20px rgba(79,227,255,0.4)); }
  .box h1{ font-size:20px; margin:0 0 10px; }
  .box p{ color:var(--ink-mute); font-size:14px; line-height:1.6; margin:0 0 26px; }
  .box code{ background:rgba(255,255,255,0.06); padding:2px 6px; border-radius:6px; font-size:12.5px; }
  button{
    font-family:inherit; font-size:14px; font-weight:600; padding:11px 26px; border-radius:999px;
    border:1px solid transparent; cursor:pointer;
    background:linear-gradient(135deg, var(--aqua), var(--aqua-deep)); color:#03131c;
  }
  button:active{ transform:scale(0.97); }

  /* własny pasek okna — identyczny jak w reszcie aplikacji */
  .app-titlebar{
    position:fixed; top:0; left:0; right:0; height:38px; display:flex; align-items:center;
    justify-content:space-between; background:linear-gradient(180deg, rgba(8,12,24,0.97), rgba(8,12,24,0.88));
    border-bottom:1px solid var(--line); -webkit-app-region:drag;
  }
  .tb-drag{ display:flex; align-items:center; gap:8px; padding-left:14px; font-size:12.5px; font-weight:700; color:#a9bcda; }
  .tb-drag img{ width:16px; height:16px; }
  .tb-controls{ display:flex; height:100%; -webkit-app-region:no-drag; }
  .tb-btn{ width:46px; height:38px; border:none; background:transparent; color:var(--ink); opacity:0.85; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .tb-btn:hover{ background:rgba(79,227,255,0.12); color:var(--aqua); opacity:1; }
  .tb-btn.tb-close:hover{ background:var(--danger); color:#fff; }
  .tb-btn svg{ width:12px; height:12px; overflow:visible; }
  .tb-btn svg rect, .tb-btn svg line{ stroke-width:1.3; }
</style>
</head>
<body>

<div class="app-titlebar">
  <div class="tb-drag"><img src="icon.png" alt=""><span>Aqua Maker</span></div>
  <div class="tb-controls">
    <button class="tb-btn" id="tbMinimize" title="Minimalizuj" type="button"><svg viewBox="0 0 10 10"><rect x="1" y="4.5" width="8" height="1" fill="currentColor"/></svg></button>
    <button class="tb-btn" id="tbMaximize" title="Maksymalizuj" type="button"><svg viewBox="0 0 10 10"><rect x="1.5" y="1.5" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1"/></svg></button>
    <button class="tb-btn tb-close" id="tbClose" title="Zamknij" type="button"><svg viewBox="0 0 10 10"><line x1="1" y1="1" x2="9" y2="9" stroke="currentColor" stroke-width="1.2"/><line x1="9" y1="1" x2="1" y2="9" stroke="currentColor" stroke-width="1.2"/></svg></button>
  </div>
</div>

<div class="box">
  <img src="icon.png" alt="">
  <h1>Nie można połączyć się z Aqua Maker</h1>
  <p id="msg">Serwer <code id="siteHost"></code> nie odpowiada prawidłowo w tej chwili. Sprawdź połączenie internetowe albo spróbuj ponownie za chwilę.</p>
  <button id="btnRetry">Spróbuj ponownie</button>
</div>

<script>
  document.getElementById('siteHost').textContent = window.aquaMaker?.siteUrl || '';
  document.getElementById('tbMinimize').addEventListener('click', () => window.aquaMaker.minimizeWindow());
  document.getElementById('tbMaximize').addEventListener('click', () => window.aquaMaker.toggleMaximizeWindow());
  document.getElementById('tbClose').addEventListener('click', () => window.aquaMaker.closeWindow());
  document.getElementById('btnRetry').addEventListener('click', () => window.aquaMaker.retryLoad());
</script>
</body>
</html>
